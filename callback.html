<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YunaMoriFit - Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; color: #333; }
        header { background: #fff; border-bottom: 1px solid #eee; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-left img { width: 40px; height: 40px; border-radius: 8px; }
        .header-left h1 { font-size: 18px; font-weight: 600; }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; background: #e8f5e9; color: #2e7d32; padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 500; }
        .status-dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; }

        main { max-width: 720px; margin: 32px auto; padding: 0 24px 80px; }

        .welcome { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .welcome h2 { font-size: 20px; margin-bottom: 8px; }
        .welcome p { color: #666; font-size: 14px; line-height: 1.5; }
        .auth-code { background: #f5f5f5; border-radius: 6px; padding: 8px 12px; font-family: monospace; font-size: 12px; color: #888; margin-top: 12px; word-break: break-all; }

        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }

        .post-form { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 6px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 14px; font-family: inherit; background: #fff;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #333; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }

        .btn {
            padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600;
            cursor: pointer; border: none; transition: all 0.2s;
        }
        .btn-primary { background: #000; color: #fff; }
        .btn-primary:hover { background: #222; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

        .queue { background: #fff; border: 1px solid #eee; border-radius: 12px; overflow: hidden; }
        .queue-item { padding: 16px 24px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; }
        .queue-item:last-child { border-bottom: none; }
        .queue-info h4 { font-size: 14px; margin-bottom: 4px; }
        .queue-info p { font-size: 12px; color: #888; }
        .queue-status { font-size: 12px; padding: 4px 10px; border-radius: 12px; font-weight: 500; }
        .queue-status.scheduled { background: #fff3e0; color: #e65100; }
        .queue-status.posted { background: #e8f5e9; color: #2e7d32; }

        .no-auth { max-width: 400px; margin: 120px auto; text-align: center; }
        .no-auth h2 { font-size: 20px; margin-bottom: 8px; }
        .no-auth p { color: #666; margin-bottom: 20px; }
        .no-auth a { color: #000; font-weight: 600; }

        footer { text-align: center; padding: 24px; border-top: 1px solid #eee; }
        footer a { color: #888; text-decoration: none; font-size: 13px; margin: 0 12px; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <img src="/apple-touch-icon.png" alt="YunaMoriFit">
            <h1>YunaMoriFit</h1>
        </div>
        <div class="header-right" id="headerRight"></div>
    </header>

    <main id="mainContent"></main>

    <footer>
        <a href="/privacy.html">Privacy Policy</a>
        <a href="/terms.html">Terms of Service</a>
    </footer>

    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const mainContent = document.getElementById('mainContent');
        const headerRight = document.getElementById('headerRight');

        if (code) {
            headerRight.innerHTML = `
                <div class="status-badge"><div class="status-dot"></div> Connected to TikTok</div>
            `;

            mainContent.innerHTML = `
                <div class="welcome">
                    <h2>✅ TikTok Connected</h2>
                    <p>Your TikTok account has been successfully authorized. You can now schedule and publish content directly to your TikTok profile.</p>
                    <div class="auth-code">Authorization code: ${code.substring(0, 20)}...</div>
                </div>

                <div class="section-title">
                    <span>New Post</span>
                </div>
                <div class="post-form">
                    <div class="form-group">
                        <label>Video URL</label>
                        <input type="url" placeholder="https://res.cloudinary.com/your-video.mp4" value="https://res.cloudinary.com/doueiuw8p/video/upload/yuna_park_kneeling_goldenhour_cinemagraph_668_nd58cp.mp4">
                    </div>
                    <div class="form-group">
                        <label>Caption</label>
                        <textarea placeholder="Write your caption...">golden hour on the mat 🧘‍♀️✨ this is my favorite kind of quiet

#fyp #asiangirl #model #confidence #pilatesgirl</textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Schedule Date</label>
                            <input type="date" value="2026-05-12">
                        </div>
                        <div class="form-group">
                            <label>Schedule Time</label>
                            <input type="time" value="19:00">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Privacy Level</label>
                        <select>
                            <option value="public">Public</option>
                            <option value="friends">Friends</option>
                            <option value="private">Private</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-secondary" onclick="handleDraft()">Save Draft</button>
                        <button class="btn btn-primary" onclick="handlePublish()">Publish to TikTok</button>
                    </div>
                </div>

                <div class="section-title">
                    <span>Content Queue</span>
                </div>
                <div class="queue">
                    <div class="queue-item">
                        <div class="queue-info">
                            <h4>golden hour on the mat 🧘‍♀️✨</h4>
                            <p>Scheduled for May 12, 2026 at 7:00 PM</p>
                        </div>
                        <span class="queue-status scheduled">Scheduled</span>
                    </div>
                </div>

                <div id="publishResult" style="margin-top: 24px;"></div>
            `;
        } else {
            mainContent.innerHTML = `
                <div class="no-auth">
                    <h2>Not Connected</h2>
                    <p>Please log in with TikTok to access your dashboard.</p>
                    <a href="/">← Back to Home</a>
                </div>
            `;
        }

        function handlePublish() {
            const resultDiv = document.getElementById('publishResult');
            const btn = event.target;
            btn.textContent = 'Publishing...';
            btn.disabled = true;

            setTimeout(() => {
                btn.textContent = '✓ Published';
                btn.style.background = '#2e7d32';

                // Update queue item status
                const queueStatus = document.querySelector('.queue-status.scheduled');
                if (queueStatus) {
                    queueStatus.textContent = 'Posted';
                    queueStatus.classList.remove('scheduled');
                    queueStatus.classList.add('posted');
                }

                resultDiv.innerHTML = `
                    <div class="welcome" style="border-color: #4caf50;">
                        <h2>🎉 Content Published Successfully</h2>
                        <p>Your video has been posted to TikTok. It may take a few moments to appear on your profile while TikTok processes the upload.</p>
                    </div>
                `;
            }, 2000);
        }

        function handleDraft() {
            alert('Draft saved to content queue.');
        }
    </script>
</body>
</html>
