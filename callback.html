<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuna Poster — Authorization</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #faf9f7;
            color: #2c2c2c;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 400;
            margin-bottom: 1rem;
        }
        .status {
            font-size: 0.95rem;
            color: #888;
            margin-bottom: 1.5rem;
        }
        .code-box {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            font-family: 'SF Mono', 'Menlo', monospace;
            font-size: 0.85rem;
            word-break: break-all;
            margin-bottom: 1rem;
            user-select: all;
            cursor: pointer;
        }
        .hint {
            font-size: 0.8rem;
            color: #aaa;
        }
        .success { color: #2d8a4e; }
        .error { color: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>yuna poster</h1>
        <div id="content"></div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        const content = document.getElementById('content');

        if (code) {
            content.innerHTML = `
                <p class="status success">authorized successfully</p>
                <div class="code-box" onclick="navigator.clipboard.writeText('${code}').then(() => { document.querySelector('.hint').textContent = 'copied!'; })">${code}</div>
                <p class="hint">click the code to copy, then paste it into the terminal</p>
            `;
        } else if (error) {
            content.innerHTML = `
                <p class="status error">authorization failed</p>
                <p class="hint">${params.get('error_description') || error}</p>
            `;
        } else {
            content.innerHTML = `
                <p class="status">waiting for authorization...</p>
            `;
        }
    </script>
</body>
</html>
