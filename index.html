<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuna Mori</title>
    <meta name="description" content="Yuna Mori — Osaka → Silver Lake. Pilates, slow mornings, 18+ archive.">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0f;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.06);
            --text-primary: #f0ece6;
            --text-secondary: rgba(240, 236, 230, 0.5);
            --accent: #c8a87e;
            --accent-glow: rgba(200, 168, 126, 0.15);
            --link-bg: rgba(200, 168, 126, 0.08);
            --link-border: rgba(200, 168, 126, 0.2);
            --link-hover-bg: rgba(200, 168, 126, 0.15);
            --link-hover-border: rgba(200, 168, 126, 0.4);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 20px 40px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse 600px 400px at 50% 0%, rgba(200, 168, 126, 0.06), transparent),
                radial-gradient(ellipse 400px 600px at 20% 50%, rgba(100, 80, 60, 0.04), transparent),
                radial-gradient(ellipse 400px 600px at 80% 80%, rgba(150, 120, 90, 0.03), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.8s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Profile Section */
        .profile {
            text-align: center;
            margin-bottom: 36px;
        }

        .profile-image-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            position: relative;
        }

        .profile-image-wrapper::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), rgba(200, 168, 126, 0.2), var(--accent));
            opacity: 0.6;
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            position: relative;
            z-index: 1;
            border: 3px solid var(--bg);
        }

        .profile-name {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 300;
            font-size: 2rem;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .profile-bio {
            font-weight: 300;
            font-size: 0.9rem;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            line-height: 1.6;
        }

        /* Social Icons */
        .socials {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 36px;
        }

        .social-icon {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            color: var(--accent);
            border-color: rgba(200, 168, 126, 0.3);
            background: var(--accent-glow);
            transform: translateY(-2px);
        }

        .social-icon svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* CTA Button */
        .cta-link {
            display: block;
            width: 100%;
            padding: 18px 24px;
            text-align: center;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
            font-weight: 400;
            font-size: 0.95rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-primary);
            background: var(--link-bg);
            border: 1px solid var(--link-border);
            border-radius: 60px;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .cta-link::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, var(--accent-glow), transparent);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .cta-link:hover {
            background: var(--link-hover-bg);
            border-color: var(--link-hover-border);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(200, 168, 126, 0.1);
        }

        .cta-link:hover::before {
            opacity: 1;
        }

        .cta-link span {
            position: relative;
            z-index: 1;
        }

        /* Age Gate */
        .age-note {
            text-align: center;
            margin-top: 32px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            letter-spacing: 0.03em;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--card-border);
        }

        .footer-text {
            font-size: 0.7rem;
            color: rgba(240, 236, 230, 0.2);
            letter-spacing: 0.05em;
        }

        /* Grain overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
            opacity: 0.4;
        }

        @media (max-width: 480px) {
            body {
                padding: 40px 16px 32px;
            }
            .profile-name {
                font-size: 1.75rem;
            }
            .socials {
                gap: 16px;
            }
        }
    </style>
</head>
