<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FP00WF5QPG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FP00WF5QPG');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuna Mori</title>
  <meta name="description" content="Yuna Mori — Osaka to Silver Lake. Pilates, slow mornings, the in-between hours.">
  <meta property="og:title" content="Yuna Mori">
  <meta property="og:description" content="Slow mornings in Silver Lake. Pilates, and the hours in between.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yunamorifit.com">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0b0a0d;
      --surface: #141317;
      --text: #e4e0dc;
      --text-mid: #c0bbb6;
      --text-soft: #9a9590;
      --accent: #c4816e;
      --accent-hover: #d4917e;
      --radius: 6px;
    }

    html { font-size: 16px; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .page {
      max-width: 540px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Hero */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 48px;
    }

    .hero-video {
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      border-radius: 8px;
      background: #111;
    }

    .hero-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      font-size: 2.2rem;
      letter-spacing: 0.02em;
      margin-top: 28px;
      text-align: center;
    }

    .hero-tagline {
      font-size: 0.92rem;
      font-weight: 300;
      color: var(--text-mid);
      margin-top: 8px;
      text-align: center;
      letter-spacing: 0.01em;
      max-width: 380px;
    }

    /* Links */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 32px;
    }

    .link-btn {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      width: 100%;
      padding: 18px 24px;
      background: var(--surface);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-decoration: none;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,0.06);
      transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
    }

    .link-btn:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .link-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .link-btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .link-btn.primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .link-handle {
      font-size: 0.78rem;
      font-weight: 300;
      color: var(--text-mid);
      letter-spacing: 0.01em;
    }

    .link-btn.primary .link-handle {
      color: rgba(255,255,255,0.8);
    }

    .dm-note {
      font-size: 0.8rem;
      color: var(--text-mid);
      text-align: center;
      margin-top: 24px;
      font-weight: 300;
    }

    /* Footer */
    .footer {
      margin-top: 56px;
      padding: 24px 0 40px;
      border-top: 1px solid rgba(255,255,255,0.05);
      text-align: center;
    }

    .footer-note {
      font-size: 0.72rem;
      color: var(--text-soft);
      opacity: 0.6;
    }

    @media (max-width: 380px) {
      .hero { padding-top: 32px; }
      .hero-name { font-size: 1.75rem; }
      .link-btn { padding: 16px 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
      .hero-video { animation: none; }
    }
  </style>
</head>
<body>
  <div class="page">

    <section class="hero">
      <video class="hero-video" autoplay muted loop playsinline poster="hero-poster.jpg">
        <source src="hero.mp4" type="video/mp4">
      </video>
      <h1 class="hero-name">Yuna Mori</h1>
      <p class="hero-tagline">Slow mornings in Silver Lake. Pilates, and the hours in between.</p>
    </section>

    <nav class="links" aria-label="Where to find Yuna">
      <a class="link-btn primary" href="https://x.com/yunamorifit" data-label="x">
        <span>Follow on X</span>
        <span class="link-handle">@yunamorifit</span>
      </a>
      <a class="link-btn" href="https://www.tiktok.com/@yunamorifit" data-label="tiktok">
        <span>TikTok</span>
        <span class="link-handle">@yunamorifit</span>
      </a>
      <a class="link-btn" href="https://www.youtube.com/@yunamorifit" data-label="youtube">
        <span>YouTube</span>
        <span class="link-handle">@yunamorifit</span>
      </a>
    </nav>

    <p class="dm-note">DMs are open on Instagram — I actually reply.</p>

    <footer class="footer">
      <p class="footer-note">AI generated or enhanced · © 2026 Yuna Mori</p>
    </footer>

  </div>
  <script>
    document.querySelectorAll('.link-btn').forEach(function(el) {
      el.addEventListener('click', function() {
        gtag('event', 'click_social', { event_category: 'navigation', event_label: el.dataset.label, transport_type: 'beacon' });
      });
    });
  </script>
</body>
</html>
